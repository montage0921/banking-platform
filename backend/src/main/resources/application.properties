spring.application.name=digital-banking-platform-backend
server.port=8080
 
# Core banking datasource (PostgreSQL). Shares the pgvector server with the
# chatbot's banking_chat database but is a separate database; see
# PrimaryDataSourceConfig and ChatbotDataSourceConfig for why both are explicit.
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://localhost:5433/banking_core}
spring.datasource.username=${APP_DB_USERNAME:banking_chat}
spring.datasource.password=${APP_DB_PASSWORD:banking_chat}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# Schema is owned by Flyway (V001__baseline_schema.sql). validate means a mapping
# that does not match the migrated schema fails startup naming the table or column,
# instead of being silently patched and failing later at query time.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
 
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyForHs256JwtTokenMinimum32Chars}
jwt.access-token-expiry=3600
jwt.refresh-token-expiry=604800
 
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
 
# Logging
logging.file.name=logs/digital-banking.log
logging.level.root=INFO
logging.level.com.group1.banking=INFO
logging.level.org.springframework.security=INFO
logging.level.com.group1.banking.service.impl.RiskScoreService=DEBUG

server.forward-headers-strategy=framework

# YAML config
spring.config.import=classpath:risk-score-rules.yaml

# Load the repo-root .env file (one level up from backend/, where this app actually
# runs from) into the Spring Environment. Real OS/CI environment variables always
# take precedence over .env values; this file is purely a local-dev convenience and
# is a no-op if missing (see springboot4-dotenv dependency).
springdotenv.directory=..
springdotenv.ignore-if-missing=true

# ===== Savings Insight Chatbot (RAG) =====

# Groq chat model, accessed via Spring AI's OpenAI-compatible client.
spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# llama-3.3-70b-versatile was deprecated by Groq in June 2026 for free/developer tier -
# gpt-oss-120b is the recommended replacement. Override with GROQ_MODEL if you want a
# different model from https://console.groq.com/docs/models.
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}
# Temperature 0 + a fixed seed so the same question against the same customer data gives
# a consistent answer, which QA validates against expected output (T-BRD 6.1, Scenario 4).
# Applies to real usage too, deliberately: for savings guidance, stable answers are worth
# more than varied phrasing, and the warmth of the replies comes from the system prompt
# rather than from sampling randomness.
#
# This makes responses consistent, not byte-identical. Temperature 0 only fixes token
# selection - it doesn't make the inference stack reproduce identical logits - and Groq
# documents `seed` as best effort ("determinism is not guaranteed"). gpt-oss-120b is also
# a mixture-of-experts model served with batched inference, which adds its own variance.
# QA assertions should target structure, figures and decisions rather than exact strings.
spring.ai.openai.chat.temperature=0
spring.ai.openai.chat.seed=42

# Local ONNX embeddings (all-MiniLM-L6-v2, 384 dims) - Groq has no embeddings API.
spring.ai.model.embedding=transformers

# Second (Postgres) datasource used only by the chatbot: pgvector knowledge base +
# chat interaction log. The primary spring.datasource.* above is a separate
# PostgreSQL database (banking_core) on the same server, used for
# all core banking data.
app.chatbot.vectorstore.datasource.url=${CHATBOT_DB_URL:jdbc:postgresql://localhost:5433/banking_chat}
app.chatbot.vectorstore.datasource.username=${CHATBOT_DB_USERNAME:banking_chat}
app.chatbot.vectorstore.datasource.password=${CHATBOT_DB_PASSWORD:banking_chat}
app.chatbot.vectorstore.datasource.driver-class-name=org.postgresql.Driver

# Savings knowledge base retrieval tuning
app.chatbot.knowledge-base.top-k=4
app.chatbot.knowledge-base.similarity-threshold=0.5
app.chatbot.transactions.lookback-days=30
app.chatbot.transactions.min-for-personalization=3

# ===== MCP (Model Context Protocol) client =====
# The chatbot can call tools exposed by external MCP servers (for example, GIC rates,
# served by the standalone voltio-rates-mcp-server module - see its own pom.xml)
# in the same turn as in-process tools. Connection is configured here by default, but
# initialization is lazy so backend startup does not fail if the MCP server is down.
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=voltio-agent
spring.ai.mcp.client.version=0.1.0
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.sse.connections.rates-server.url=${MCP_RATES_SERVER_URL:http://localhost:8081}

# A tool that throws (in-process or MCP) is reported back to the model as a message so
# the conversation continues with a degraded answer instead of failing the whole chat
# request - required for US3 (chat stays available if the rates MCP server is down).
# Explicit here (rather than relying on the Spring AI default) so a future change to
# that default can't silently regress this behavior.
spring.ai.tools.throw-exception-on-error=false

# Example of adding a future MCP server over stdio (one block per server) - uncomment
# and fill in once a real MCP server exists:
# spring.ai.mcp.client.stdio.connections.example.command=node
# spring.ai.mcp.client.stdio.connections.example.args=/path/to/mcp-server.js

# Additional MCP servers can be added as more spring.ai.mcp.client.* connection blocks.
